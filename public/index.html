<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DollhouseHair</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom, #000, #1a1a1a);
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
    }

    h1 {
      color: hotpink;
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #ccc;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 26px;
      margin: 10px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s ease;
    }

    .book-btn {
      background: linear-gradient(45deg, hotpink, pink);
      color: black;
      box-shadow: 0 0 15px hotpink;
    }

    .admin-btn {
      background: black;
      color: hotpink;
      border: 1px solid hotpink;
    }

    .btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    footer {
      margin-top: 60px;
      font-size: 12px;
      color: #777;
    }

    .instagram {
      color: hotpink;
      text-decoration: none;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <img src="dollhouse-logo.png" class="logo" alt="DollhouseHair Logo">

    <!-- TITLE -->
    <h1>DollhouseHair 💖</h1>

    <p>Luxury Hair Services • Book Your Appointment</p>

    <!-- BOOK BUTTON -->
    <button class="btn book-btn" onclick="window.location.href='booking.html'">
      Book Appointment
    </button>

    <!-- ADMIN BUTTON -->
    <button class="btn admin-btn" onclick="window.location.href='admin.html'">
      Admin Login
    </button>

    <!-- INSTAGRAM -->
    <p>
      Follow us:
      <a class="instagram" href="https://instagram.com/dollhouse._hair" target="_blank">
        @dollhouse._hair
      </a>
    </p>

    <footer>
      © DollhouseHair 2026
    </footer>

  </div>

</body>
</html>
